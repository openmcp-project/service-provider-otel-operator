name: Release
run-name: ${{ github.event_name == 'release' && 'Process published release' || 'Update draft release' }}

on:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: openmcp-project/build/.github/workflows/release.lib.yaml@ff4e6ae746b952402039b3535d1003ad0c3b03fa # main
    secrets:
      app_private_key: ${{ secrets.OPENMCP_CI_APP_PRIVATE_KEY }}
  publish:
    if: github.event_name == 'release'
    needs: release
    uses: openmcp-project/build/.github/workflows/publish.lib.yaml@ff4e6ae746b952402039b3535d1003ad0c3b03fa # main
    secrets:
      app_private_key: ${{ secrets.OPENMCP_CI_APP_PRIVATE_KEY }}
