name: Release
run-name: ${{ github.event_name == 'release' && 'Process published release' || 'Update draft release' }}

on:
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: openmcp-project/build/.github/workflows/release.lib.yaml@88d029ddfe88e117ace5cd698781954d9a6536c6 # main
    secrets:
      app_private_key: ${{ secrets.OPENMCP_CI_APP_PRIVATE_KEY }}
  publish:
    if: github.event_name == 'release'
    needs: release
    uses: openmcp-project/build/.github/workflows/publish.lib.yaml@88d029ddfe88e117ace5cd698781954d9a6536c6 # main
    secrets:
      app_private_key: ${{ secrets.OPENMCP_CI_APP_PRIVATE_KEY }}
