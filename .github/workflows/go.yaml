name: E2E Tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-26.04
    env:
      E2E_DIAGNOSTICS_DIR: ${{ runner.temp }}/e2e-diagnostics
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Snapshot host before tasks
        run: bash hack/e2e-diagnostics.sh host || echo '::warning::Host diagnostics failed'

      - name: task generate
        run: |
          task generate --verbose

      - name: task validate
        run: task validate --verbose

      - name: Running Test e2e with diagnostics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$E2E_DIAGNOSTICS_DIR"
          watcher=
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            if [[ -n "$watcher" ]]; then
              kill "$watcher" 2>/dev/null || true
              wait "$watcher" 2>/dev/null || true
            fi
            bash hack/e2e-diagnostics.sh snapshot || echo '::warning::Final e2e diagnostics failed'
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          bash hack/e2e-diagnostics.sh watch &
          watcher=$!
          task test-e2e 2>&1 | bash hack/e2e-diagnostics.sh redact | tee "$E2E_DIAGNOSTICS_DIR/e2e.log"

      - name: Upload e2e diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.E2E_DIAGNOSTICS_DIR }}
          retention-days: 7
          if-no-files-found: warn
