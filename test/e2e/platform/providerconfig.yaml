apiVersion: oteloperator.services.openmcp.cloud/v1alpha1
kind: ProviderConfig
metadata:
  name: oteloperator
spec:
  pollInterval: 1m
  chartURL: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-operator
  helmValues:
    admissionWebhooks:
      certManager:
        enabled: false
      autoGenerateCert:
        enabled: true
    manager:
      collectorImage:
        repository: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s"
