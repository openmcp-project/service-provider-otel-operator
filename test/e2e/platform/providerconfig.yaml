apiVersion: oteloperator.services.openmcp.cloud/v1alpha1
kind: ProviderConfig
metadata:
  name: otel-operator
spec:
  pollInterval: 1m
  versions:
    - version: v0.158.0
      chartVersion: 0.20.8
      chartURL: oci://ghcr.io/open-telemetry/opentelemetry-helm-charts/opentelemetry-kube-stack
      helmValues:
        opentelemetry-operator:
          admissionWebhooks:
            certManager:
              enabled: false
            autoGenerateCert:
              enabled: true
